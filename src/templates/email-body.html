    <!DOCTYPE html>
    <html lang="pt">
    <head>
    <meta charset="UTF-8" />
    <title>Jira / Xray Report</title>

    <style>
        body {
        margin: 0;
        padding: 30px;
        font-family: Arial, Helvetica, sans-serif;
        color: #172b4d;
        background: #ffffff;
        font-size: 14px;
        }

        .email-container {
        width: 100%;
        max-width: 1050px; /* meio termo */
        margin: 0 auto;
        }

        .intro-text {
        margin-bottom: 14px;
        line-height: 1.5;
        }

        .observation-title {
        font-weight: bold;
        margin-bottom: 8px;
        }

        #observations {
        min-height: 80px;
        padding: 12px;
        border: 1px solid #c1c7d0;
        border-radius: 6px;
        margin-bottom: 30px;
        line-height: 1.5;
        }

        #observations:empty::before {
        content: attr(data-placeholder);
        color: #8993a4;
        }

        .section-wrapper {
        width: 100%;
        max-width: 1050px;
        margin: 0 auto 24px auto;
        }

        .signature {
        margin-top: 30px;
        line-height: 1.5;
        }
    </style>
    </head>

    <body>
    <div class="email-container">
        <p class="intro-text">Bom dia,</p>

        <p class="intro-text">
        Segue o resumo da execução de testes:
        </p>

        <div class="observation-title">Observações:</div>

        <div
        id="observations"
        contenteditable="true"
        data-placeholder="Clique aqui para adicionar comentários ou observações..."
        ></div>

        <!-- REPORTS -->
        

        <!-- DASHBOARD -->
        

        <!-- SIGNATURE -->
        <div class="signature">
        <p>
            Cumprimentos,<br />
            QA Team
        </p>
        </div>
    </div>
    </body>
    </html>
