<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Jira / Xray Report</title>

<style>
    /* OVERALL RESULTS STYLES */
    *, *::before, *::after { box-sizing: border-box; }

    body {
        margin: 0;
        padding: clamp(12px, 2vw, 30px);
        font-family: Arial, Helvetica, sans-serif;
        color: #172b4d;
        background: #ffffff;
        font-size: 11px;
    }

    .report-toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 24px;
        margin-bottom: 28px;
        padding: clamp(22px, 3vw, 36px);
        border-radius: 18px;
        background: linear-gradient(115deg, #142e57, #0052cc);
        color: #ffffff;
        box-shadow: 0 10px 28px #172b4d14;
    }

    .report-toolbar-heading { flex: 1 1 280px; min-width: 0; }
    .report-eyebrow {
        margin: 0 0 10px;
        color: #b9d6ff;
        font-size: 11px;
        font-weight: bold;
        letter-spacing: 1.5px;
    }
    .report-toolbar h1 {
        margin: 0;
        font-size: 14px;
        letter-spacing: 0;
        line-height: 1.2;
    }
    .report-toolbar-description {
        margin: 10px 0 0;
        color: #e0ecff;
        font-size: 11px;
        line-height: 1.5;
    }
    .report-toolbar-actions { max-width: 100%; }
    #copy-email-button {
        max-width: 100%;
        padding: 14px 20px;
        border: 1px solid #ffffff;
        border-radius: 10px;
        background: #ffffff;
        color: #0747a6;
        font: inherit;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0 4px 12px #091e4233;
    }
    #copy-email-button:hover { background: #eaf2ff; }
    #copy-email-status {
        margin-top: 10px;
        min-height: 18px;
        color: #ffffff;
        font-size: 11px;
        line-height: 1.4;
    }

    .report-workspace {
        --picker-width: clamp(240px, 18vw, 300px);
        --picker-gap: clamp(16px, 1.5vw, 24px);
        width: 100%;
        padding-right: calc(var(--picker-width) + var(--picker-gap));
    }
    .email-container { width: 100%; min-width: 0; overflow-wrap: anywhere; }
    .intro-text { margin-bottom: 14px; line-height: 1.5; }
    .observation-title { font-weight: bold; font-size: 14px; margin-bottom: 8px; }
    #observations {
        min-height: 80px;
        padding: 12px;
        border: 1px solid #b8c9e2;
        border-radius: 10px;
        background: #ffffff;
        box-shadow: 0 3px 12px #172b4d06;
        margin-bottom: 30px;
        line-height: 1.5;
    }
    #observations:empty::before { content: attr(data-placeholder); color: #5e6c84; }
    #observations img { max-width: 100%; height: auto; }
    .section-wrapper { width: 100%; margin: 0 auto 24px; }
    .signature { margin-top: 30px; line-height: 1.5; }

    #global-status-section { position: relative; }
    .global-position-picker {
        position: absolute;
        top: 0;
        left: calc(100% + var(--picker-gap));
        width: var(--picker-width);
        min-width: 0;
        margin: 0;
        padding: 18px 16px;
        border: 1px solid #cbd9ec;
        border-radius: 14px;
        background: #ffffff;
        box-shadow: 0 6px 20px #172b4d08;
    }
    .global-position-picker legend { padding: 0 6px; font-weight: bold; color: #0747a6; }
    .global-position-picker p { margin: 0 0 12px; color: #5e6c84; font-size: 11px; line-height: 1.5; }
    .global-position-options {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 5px 12px;
    }
    .global-position-choice {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px;
        border-radius: 7px;
        font-size: 11px;
        cursor: pointer;
        overflow-wrap: anywhere;
    }
    .global-position-choice:hover,
    .global-position-choice:has(input:checked) { background: #eaf2ff; color: #0747a6; }
    .global-position-choice input { margin: 0; width: 16px; height: 16px; flex-shrink: 0; accent-color: #0052cc; }
    .global-position-actions {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 14px;
        font-size: 11px;
    }
    .global-position-actions button {
        padding: 8px 10px;
        border: 1px solid #b8c9e2;
        border-radius: 7px;
        background: #ffffff;
        color: #0052cc;
        font: inherit;
        cursor: pointer;
    }
    .global-position-actions button:hover { background: #eaf2ff; }
    #global-position-count {
        display: block;
        width: 100%;
        padding-top: 12px;
        border-top: 1px solid #e1e9f4;
        color: #0747a6;
        font-size: 11px;
        font-weight: bold;
    }
    .global-status-fields {
        display: grid;
        grid-template-columns: 16px minmax(0, 300px) minmax(0, 1fr);
        align-items: center;
        gap: 8px;
    }
    .global-status-fields select,
    .global-status-fields input,
    .installation-status-fields select {
        width: 100%;
        max-width: 100%;
        min-width: 0;
        padding: 9px;
        border: 1px solid #b8c9e2;
        border-radius: 7px;
        background: #ffffff;
        color: #172b4d;
        font: inherit;
    }
    .global-status-fields select,
    .installation-status-fields select { font-weight: bold; cursor: pointer; }
    .installation-status-fields {
        display: grid;
        grid-template-columns: 16px minmax(0, 1fr);
        align-items: center;
        gap: 8px;
    }
    .global-status-placeholder {
        min-width: 0;
        padding: 6px 10px;
        border: 1px dashed #c1c7d0;
        border-radius: 7px;
        background: #ffffff;
    }

    #global-status-table { table-layout: fixed; }
    #position-activities-table { min-width: 1050px; overflow-wrap: anywhere; }
    [data-activity-note],
    [data-blocker-field] {
        display: block;
        width: 100%;
        max-width: 100%;
        min-width: 0;
        min-height: 84px;
        padding: 10px;
        border: 1px solid #cbd9ec;
        border-radius: 8px;
        background: #ffffff;
        color: #172b4d;
        font: inherit;
        line-height: 1.5;
        resize: vertical;
    }
    [data-activity-note]::placeholder,
    [data-blocker-field]::placeholder,
    .global-status-fields input::placeholder { color: #5e6c84; }
    [data-activity-note]:focus-visible,
    [data-blocker-field]:focus-visible,
    #observations:focus-visible,
    button:focus-visible,
    a:focus-visible,
    .report-table-scroll:focus-visible { outline: 2px solid #0052cc; outline-offset: 3px; }
    #copy-email-button:focus-visible { outline-color: #ffffff; }
    .global-status-fields select:focus,
    .installation-status-fields select:focus,
    .global-status-fields input:focus { outline: 2px solid #0052cc; outline-offset: 1px; }
    .report-summary-table { box-shadow: 0 4px 16px #172b4d08; }
    .blocker-actions { margin-top:12px; }
    [data-add-blocker],
    [data-remove-blocker] {
        padding:8px 12px;
        border:1px solid #b8c9e2;
        border-radius:7px;
        background:#ffffff;
        color:#0052cc;
        font:inherit;
        cursor:pointer;
    }
    [data-add-blocker]:hover { background:#eaf2ff; }
    [data-remove-blocker] { margin-top:8px; color:#ae2e24; border-color:#f1b5af; }
    [data-remove-blocker]:hover:not(:disabled) { background:#ffedeb; }
    [data-remove-blocker]:disabled { opacity:0.45; cursor:default; }
    .report-summary-table thead th { letter-spacing: 0.3px; }
    .report-summary-table thead th:first-child { border-top-left-radius: 10px; }
    .report-summary-table thead th:last-child { border-top-right-radius: 10px; }
    [data-position-activity]:last-child { margin-bottom: 0 !important; }
    [data-position-activity] a:hover { color: #0052cc !important; text-decoration: underline !important; }
    [data-position-defect]:hover { color: #0052cc !important; }
    #release-links-table a:hover { color: #0747a6 !important; text-decoration: underline !important; }
    #release-links-table tbody tr:last-child th { border-bottom-left-radius: 9px; }
    #release-links-table tbody tr:last-child td { border-bottom-right-radius: 9px; }
    .position-block,
    .dashboard-block { box-shadow: 0 5px 20px #172b4d08; }
    .operation-card:last-child { margin-bottom: 0 !important; }
    .jira-issues-table tr:hover,
    .dashboard-table tbody tr:hover { background: #f1f6ff; }
    .report-table-scroll { max-width: 100%; overflow-x: auto; }
    .jira-issues-table { min-width: 560px; }
    .dashboard-table { min-width: 720px; }
    .dashboard-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px 16px;
        flex-wrap: wrap;
    }

    @media (max-width: 1099px) {
        .report-workspace { padding-right: 0; }
        .global-position-picker { position: static; width: 100%; margin-bottom: 16px; }
    }
    @media (max-width: 700px) {
        .report-toolbar { gap: 18px; border-radius: 12px; }
        .report-toolbar-actions,
        #copy-email-button { width: 100%; }
        .global-position-options { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        #position-defects-table th,
        #position-defects-table td { padding: 8px 6px !important; }
        #release-links-table th,
        #release-links-table td { padding: 10px 8px !important; }
        #release-links-table thead th:first-child { width: 35% !important; }
        #global-status-table thead th:first-child { width: 28% !important; }
        #global-status-table th,
        #global-status-table td { padding:8px 6px !important; }
        .global-status-fields { grid-template-columns: 16px minmax(0, 1fr); }
        .global-status-fields input,
        .global-status-placeholder-note { grid-column: 1 / -1; }
        .position-content,
        .operation-card { padding: 10px !important; }
    }
</style>
</head>

<!-- =========================================
     SCRIPT DE CÓPIA
     ========================================= -->

<script>
    /* OVERALL RESULTS SCRIPT */

    function initializeGlobalStatuses() {
        const table = document.getElementById('global-status-table');
        if (!table) return;

        const section = document.getElementById('global-status-section');
        const rows = Array.from(table.querySelectorAll('[data-global-status-row]'));
        const toggles = new Map(Array.from(section.querySelectorAll('[data-position-toggle]'))
            .map(toggle => [toggle.value, toggle]));
        const storageKey = 't2d:global-status:v1:' + window.location.pathname + ':' + table.dataset.reportKey;
        let savedRows = [];

        try {
            const saved = JSON.parse(localStorage.getItem(storageKey) || '[]');
            if (Array.isArray(saved)) savedRows = saved;
        } catch (error) {
            // A edição continua disponível quando o armazenamento está bloqueado.
        }

        function save() {
            try {
                localStorage.setItem(storageKey, JSON.stringify(rows.map(row => ({
                    position: row.dataset.position,
                    selected: toggles.get(row.dataset.position).checked,
                    status: row.querySelector('[data-status-select]').value,
                    installation: row.querySelector('[data-installation-select]').value,
                    note: row.querySelector('[data-status-note]').value,
                }))));
            } catch (error) {
                // Não impede a edição nem a cópia em navegadores sem armazenamento.
            }
        }

        function updateSelection() {
            let count = 0;
            rows.forEach(row => {
                row.hidden = !toggles.get(row.dataset.position).checked;
                if (!row.hidden) count++;
            });
            document.getElementById('global-status-empty').hidden = count !== 0;
            document.getElementById('global-position-count').textContent = count === 1
                ? '1 posto selecionado'
                : count + ' postos selecionados';
        }

        rows.forEach(row => {
            const toggle = toggles.get(row.dataset.position);
            const select = row.querySelector('[data-status-select]');
            const note = row.querySelector('[data-status-note]');
            const dot = row.querySelector('[data-status-dot]');
            const installation = row.querySelector('[data-installation-select]');
            const installationDot = row.querySelector('[data-installation-dot]');
            const saved = savedRows.find(item => item && item.position === row.dataset.position)
                || savedRows.find(item => item && item.position === 'SEM POSIÇÃO'
                    && row.dataset.position === 'Exploratory Testing');

            if (saved) {
                // As escolhas anteriores à seleção de postos continuam disponíveis.
                toggle.checked = typeof saved.selected === 'boolean' ? saved.selected : true;
                if (Array.from(select.options).some(option => option.value === saved.status)) {
                    select.value = saved.status;
                }
                if (typeof saved.note === 'string') note.value = saved.note.slice(0, note.maxLength);
                if (Array.from(installation.options).some(option => option.value === saved.installation)) {
                    installation.value = saved.installation;
                }
            }

            function updateDot() {
                dot.style.color = select.selectedOptions[0].dataset.color;
            }
            function updateInstallation() {
                const color = installation.selectedOptions[0].dataset.color;
                installation.style.color = color;
                installationDot.style.color = color;
            }

            updateDot();
            updateInstallation();
            installation.addEventListener('change', () => {
                updateInstallation();
                save();
            });
            toggle.addEventListener('change', () => {
                updateSelection();
                save();
            });
            select.addEventListener('change', () => {
                updateDot();
                save();
            });
            note.addEventListener('input', save);
        });

        function selectAll(selected) {
            toggles.forEach(toggle => { toggle.checked = selected; });
            updateSelection();
            save();
        }

        section.querySelector('[data-select-all-positions]').addEventListener('click', () => selectAll(true));
        section.querySelector('[data-clear-positions]').addEventListener('click', () => selectAll(false));
        updateSelection();
    }

    function initializeActivityNotes() {
        const table = document.getElementById('position-activities-table');
        if (!table) return;
        const notes = Array.from(table.querySelectorAll('[data-activity-note]'));
        const storageKey = 't2d:position-activities:v1:' + window.location.pathname + ':' + table.dataset.reportKey;
        let savedNotes = [];
        try {
            const saved = JSON.parse(localStorage.getItem(storageKey) || '[]');
            if (Array.isArray(saved)) savedNotes = saved;
        } catch (error) {
            // A edição funciona mesmo quando o armazenamento está indisponível.
        }

        function resizeNote(note) {
            if (!note.isConnected) return;
            note.style.height = 'auto';
            note.style.height = (note.scrollHeight + 2) + 'px';
        }

        notes.forEach(note => {
            const saved = savedNotes.find(item => item && item.position === note.dataset.position)
                || savedNotes.find(item => item && item.position === 'SEM POSIÇÃO'
                    && note.dataset.position === 'Exploratory Testing');
            if (saved && typeof saved.note === 'string') note.value = saved.note;
            resizeNote(note);
            note.addEventListener('input', () => {
                resizeNote(note);
                try {
                    localStorage.setItem(storageKey, JSON.stringify(notes.map(input => ({
                        position: input.dataset.position, note: input.value,
                    }))));
                } catch (error) {
                    // Não bloqueia a edição nem a cópia para o e-mail.
                }
            });
        });
        window.addEventListener('resize', () => notes.forEach(resizeNote));
    }

    function initializeBlockers() {
        const table = document.getElementById('main-blockers-table');
        if (!table) return;
        const body = table.tBodies[0];
        const rowTemplate = body.rows[0].cloneNode(true);
        const rows = () => Array.from(body.querySelectorAll('[data-blocker-row]'));
        const fields = () => Array.from(body.querySelectorAll('[data-blocker-field]'));
        const storageKey = 't2d:main-blockers:v1:' + window.location.pathname + ':' + table.dataset.reportKey;
        let savedRows = [];
        try {
            const saved = JSON.parse(localStorage.getItem(storageKey) || 'null');
            if (Array.isArray(saved)) {
                // O formato anterior tinha cinco linhas fixas. Migra apenas as
                // preenchidas; as linhas vazias adicionadas agora são guardadas.
                savedRows = saved.filter(row => row && (
                    (typeof row.theme === 'string' && row.theme.trim())
                    || (typeof row.impact === 'string' && row.impact.trim())
                ));
            } else if (saved && saved.version === 2 && Array.isArray(saved.rows)) {
                savedRows = saved.rows;
            }
        } catch (error) {
            // A edição continua disponível sem armazenamento.
        }
        function save() {
            try {
                localStorage.setItem(storageKey, JSON.stringify({
                    version: 2,
                    rows: rows().map(row => ({
                        theme: row.querySelector('[data-blocker-field="theme"]').value,
                        impact: row.querySelector('[data-blocker-field="impact"]').value,
                    })),
                }));
            } catch (error) {
                // Não bloqueia a edição nem a cópia.
            }
        }
        function updateRows() {
            const currentRows = rows();
            currentRows.forEach((row, index) => {
                row.dataset.blockerRow = index;
                row.style.background = index % 2 ? '#f8faff' : '#ffffff';
                row.querySelector('[data-blocker-field="theme"]').setAttribute('aria-label', 'Tema do bloqueador ' + (index + 1));
                row.querySelector('[data-blocker-field="impact"]').setAttribute('aria-label', 'Impacto do bloqueador ' + (index + 1));
                const remove = row.querySelector('[data-remove-blocker]');
                remove.setAttribute('aria-label', 'Remover bloqueador ' + (index + 1));
                remove.disabled = currentRows.length === 1;
            });
        }
        function resize(field) {
            if (!field.isConnected) return;
            field.style.height = 'auto';
            field.style.height = (field.scrollHeight + 2) + 'px';
        }
        function addRow(saved = {}, focus = false) {
            const row = rowTemplate.cloneNode(true);
            body.appendChild(row);
            row.querySelectorAll('[data-blocker-field]').forEach(field => {
                if (saved && typeof saved[field.dataset.blockerField] === 'string') {
                    field.value = saved[field.dataset.blockerField];
                }
                resize(field);
                field.addEventListener('input', () => {
                    resize(field);
                    save();
                });
            });
            row.querySelector('[data-remove-blocker]').addEventListener('click', () => {
                if (rows().length === 1) return;
                const neighbor = row.nextElementSibling || row.previousElementSibling;
                row.remove();
                updateRows();
                save();
                neighbor.querySelector('[data-blocker-field="theme"]').focus();
            });
            updateRows();
            if (focus) row.querySelector('[data-blocker-field="theme"]').focus();
        }
        body.replaceChildren();
        (savedRows.length ? savedRows : [{}]).forEach(saved => addRow(saved));
        document.querySelector('[data-add-blocker]').addEventListener('click', () => {
            addRow({}, true);
            save();
        });
        save();
        window.addEventListener('resize', () => fields().forEach(resize));
    }

    function prepareBlockersForCopy(report, restoreActions) {
        report.querySelectorAll('[data-blocker-field]').forEach(field => {
            const text = document.createElement('div');
            text.style.cssText = 'line-height:1.5;white-space:normal;word-wrap:break-word;overflow-wrap:anywhere;';
            const value = field.value.trim() ? field.value : '--';
            value.split('\n').forEach((line, index) => {
                if (index) text.appendChild(document.createElement('br'));
                text.appendChild(document.createTextNode(line || '\u00a0'));
            });
            restoreActions.push(() => text.replaceWith(field));
            field.replaceWith(text);
        });
    }

    function prepareActivityTableForCopy(report, restoreActions) {
        const table = report.querySelector('#position-activities-table');
        if (!table) return;
        const originalStyle = table.getAttribute('style');
        restoreActions.push(() => table.setAttribute('style', originalStyle));
        table.style.minWidth = '0';
        table.querySelectorAll('[data-activity-note]').forEach(note => {
            const text = document.createElement('div');
            text.style.cssText = 'line-height:1.5;white-space:normal;word-wrap:break-word;overflow-wrap:anywhere;';
            const value = note.value.trim() ? note.value : '\u00a0';
            value.split('\n').forEach((line, index) => {
                if (index) text.appendChild(document.createElement('br'));
                text.appendChild(document.createTextNode(line || '\u00a0'));
            });
            restoreActions.push(() => text.replaceWith(note));
            note.replaceWith(text);
        });
    }

    function prepareReportForCopy(report, restoreActions) {
        // Substitui os controlos por texto durante a cópia síncrona.
        function removeDuringCopy(element) {
            const placeholder = document.createComment('editor-only');
            restoreActions.push(() => placeholder.replaceWith(element));
            element.replaceWith(placeholder);
        }

        prepareActivityTableForCopy(report, restoreActions);
        prepareBlockersForCopy(report, restoreActions);

        // A cópia inclui as tabelas completas, sem as áreas de deslocamento da página.
        report.querySelectorAll('[data-report-scroll]').forEach(wrapper => {
            const placeholder = document.createComment('report-table-scroll');
            const contents = Array.from(wrapper.childNodes);
            restoreActions.push(() => {
                wrapper.replaceChildren(...contents);
                placeholder.replaceWith(wrapper);
            });
            wrapper.replaceWith(placeholder, ...contents);
        });

        const observations = report.querySelector('#observations');
        if (observations
            && !observations.textContent.replace(/[\s\u200b-\u200d\u2060\ufeff]/g, '')
            && !observations.querySelector('img, svg, canvas, video, audio, iframe, object, embed, hr, table')) {
            // Um espaço não separável evita enviar um bloco sem conteúdo ao Outlook.
            // Preserva também os nós que o editor deixa depois de apagar o texto (ex.: <br>).
            const originalNodes = Array.from(observations.childNodes);
            const originalStyle = observations.getAttribute('style');
            const originalHeight = observations.getBoundingClientRect().height;
            restoreActions.push(() => {
                observations.replaceChildren(...originalNodes);
                if (originalStyle === null) observations.removeAttribute('style');
                else observations.setAttribute('style', originalStyle);
            });
            observations.style.minHeight = originalHeight + 'px';
            observations.replaceChildren(document.createTextNode('\u00a0'));
        }

        const globalStatusSection = report.querySelector('#global-status-section');
        if (globalStatusSection && !globalStatusSection.querySelector('[data-global-status-row]:not([hidden])')) {
            removeDuringCopy(globalStatusSection);
        }

        const overallSection = report.querySelector('#overall-results-section');
        if (overallSection && !overallSection.querySelector('[data-overall-plan]:not([hidden])')) {
            removeDuringCopy(overallSection);
        } else if (overallSection) {
            overallSection.querySelectorAll('[data-overall-plan][hidden]').forEach(removeDuringCopy);
        }

        report.querySelectorAll('[data-global-status-row]').forEach(row => {
            if (row.hidden) {
                removeDuringCopy(row);
                return;
            }

            const select = row.querySelector('[data-status-select]');
            const selected = select.selectedOptions[0];
            const note = row.querySelector('[data-status-note]').value.trim();
            const fields = row.querySelector('.global-status-fields');
            const summary = document.createElement('div');
            const dot = row.querySelector('[data-status-dot]').cloneNode(true);
            const label = document.createElement('strong');

            dot.style.color = selected.dataset.color;
            label.textContent = select.value ? selected.textContent.trim() : 'Não definido';
            summary.append(dot, document.createTextNode(' '), label);
            if (note) summary.appendChild(document.createTextNode(' — ' + note));

            restoreActions.push(() => summary.replaceWith(fields));
            fields.replaceWith(summary);
            const installationFields = row.querySelector('.installation-status-fields');
            const installationSelect = row.querySelector('[data-installation-select]');
            const installationLabel = document.createElement('strong');
            installationLabel.style.color = installationSelect.selectedOptions[0].dataset.color;
            installationLabel.textContent = installationSelect.selectedOptions[0].textContent;
            restoreActions.push(() => installationLabel.replaceWith(installationFields));
            installationFields.replaceWith(installationLabel);
        });

        report.querySelectorAll('[data-editor-only]').forEach(removeDuringCopy);

        report.querySelectorAll('[contenteditable]').forEach(element => {
            const attributes = ['contenteditable', 'data-placeholder']
                .filter(attribute => element.hasAttribute(attribute))
                .map(attribute => [attribute, element.getAttribute(attribute)]);
            restoreActions.push(() => {
                attributes.forEach(([attribute, value]) => element.setAttribute(attribute, value));
            });
            attributes.forEach(([attribute]) => element.removeAttribute(attribute));
        });
    }

    function createEmailClipboardHtml(report) {
        const clone = report.cloneNode(true);
        const sourceElements = [report, ...report.querySelectorAll('*')];
        const clonedElements = [clone, ...clone.querySelectorAll('*')];
        // Preserva a aparência sem converter as larguras percentuais em pixels,
        // como acontece na serialização nativa do navegador para o clipboard.
        const visualProperties = [
            'box-sizing', 'font-family', 'font-size', 'font-weight', 'font-style',
            'color', 'background-color', 'line-height', 'text-align',
            'text-decoration', 'vertical-align', 'white-space', 'overflow-wrap',
            'word-break', 'padding', 'margin', 'border', 'border-radius',
            'border-collapse', 'border-spacing', 'table-layout',
        ];
        sourceElements.forEach((element, index) => {
            const computed = getComputedStyle(element);
            const target = clonedElements[index];
            visualProperties.forEach(property => {
                target.style.setProperty(property, computed.getPropertyValue(property));
            });
        });
        clone.style.width = '100%';
        clone.style.maxWidth = '100%';
        clone.style.minWidth = '0';
        clone.style.backgroundColor = '#ffffff';
        clone.querySelectorAll('#position-activities-table, #position-defects-table, #main-blockers-table, #release-links-table, .overall-results-table').forEach(table => {
            table.style.width = '100%';
            table.style.maxWidth = '100%';
            table.style.minWidth = '0';
            table.querySelectorAll('th, td').forEach(cell => {
                cell.style.padding = '8px 6px';
            });
        });

        const observations = clone.querySelector('#observations');
        if (observations) {
            const outlookWrapper = document.createElement('div');
            outlookWrapper.setAttribute('data-olk-copy-source', 'MessageBody');
            outlookWrapper.setAttribute(
                'style',
                'border:0;font-style:inherit;font-variant:inherit;font-weight:inherit;font-stretch:inherit;font-size:11px;line-height:inherit;font-family:Calibri,Helvetica,sans-serif;margin:0;padding:0;vertical-align:baseline;color:inherit;direction:ltr;'
            );
            outlookWrapper.append(...Array.from(observations.childNodes));
            observations.appendChild(outlookWrapper);
        }

        return clone.outerHTML;
    }

    initializeGlobalStatuses();
    initializeActivityNotes();
    initializeBlockers();

    function copyEmailReport() {

        const report =
            document.querySelector(
                '.email-container'
            );

        const status =
            document.getElementById(
                'copy-email-status'
            );


        if (!report) {

            status.textContent =
                'Não foi possível encontrar o relatório.';

            return;
        }


        const range =
            document.createRange();


        const selection =
            window.getSelection();


        if (!selection) {

            status.textContent =
                'Não foi possível selecionar o relatório.';

            return;
        }


        const restoreActions = [];

        try {
            prepareReportForCopy(report, restoreActions);
            range.selectNodeContents(report);
            selection.removeAllRanges();
            selection.addRange(range);

            const html = createEmailClipboardHtml(report);
            const plainText = report.innerText;
            const writeClipboard = event => {
                if (!event.clipboardData) return;
                event.clipboardData.setData('text/html', html);
                event.clipboardData.setData('text/plain', plainText);
                event.preventDefault();
            };
            document.addEventListener('copy', writeClipboard, true);
            restoreActions.push(() => document.removeEventListener('copy', writeClipboard, true));

            const copied =
                document.execCommand(
                    'copy'
                );


            selection.removeAllRanges();


            if (copied) {

                status.textContent =
                    '✓ Relatório copiado. Agora cole no Outlook com Ctrl + V.';

            }

            else {

                status.textContent =
                    'Não foi possível copiar o relatório.';

            }

        }

        catch (error) {

            selection.removeAllRanges();

            console.error(
                'Erro ao copiar:',
                error
            );


            status.textContent =
                'Não foi possível copiar o relatório.';

        }


        finally {
            selection.removeAllRanges();
            restoreActions.reverse().forEach(restore => restore());
        }

        setTimeout(
            () => {

                status.textContent =
                    '';

            },
            5000
        );

    }

</script>
