name: T2D · Gerar relatório
run-name: T2D · ${{ github.actor }} · execução ${{ github.run_number }}

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Cole o JSON copiado pela interface T2D'
        required: true
        type: string

permissions:
  contents: read

# Evita vários pedidos MFA simultâneos para a conta corporativa configurada.
concurrency:
  group: t2d-jira
  cancel-in-progress: false

jobs:
  report:
    name: Autenticar, extrair e gerar relatório
    runs-on: ${{ vars.T2D_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 45
    steps:
      - name: Proteger dados corporativos
        if: ${{ !github.event.repository.private }}
        run: |
          echo "Use um repositório privado para impedir a exposição de logs e relatórios do Jira."
          exit 1
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Validar configuração
        run: npm run config:validate
        env:
          T2D_CONFIG_JSON: ${{ inputs.configuration }}
      - name: Instalar Chromium
        if: ${{ vars.T2D_RUNNER_LABEL == '' }}
        run: npx playwright install --with-deps chromium
      - name: Executar T2D · acompanhar MFA e progresso aqui
        run: npm run report
        env:
          T2D_CONFIG_JSON: ${{ inputs.configuration }}
          JIRA_URL: ${{ secrets.JIRA_URL }}
          JIRA_LOGIN_EMAIL: ${{ secrets.JIRA_LOGIN_EMAIL }}
          T2D_AUTH_TIMEOUT_MS: '300000'
          T2D_BROWSER_CHANNEL: ${{ vars.T2D_BROWSER_CHANNEL }}
          T2D_HEADLESS: 'true'
      - name: Guardar relatórios interativos
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: t2d-relatorios-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            output/report.html
            output/email.html
            output/report.json
            output/report.txt
            output/dashboard.json
          if-no-files-found: error
          retention-days: 30
      - name: Guardar estado e etapas
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: t2d-progresso-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            output/status.json
            output/progress.jsonl
          if-no-files-found: ignore
          retention-days: 30
